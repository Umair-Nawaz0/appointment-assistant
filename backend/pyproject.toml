[project]
name = "appointment-assistant-api"
version = "1.0.0"
description = "FastAPI backend for the Appointment Assistant dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "asyncpg>=0.30,<1",
  "python-dotenv>=1.0,<2",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.3,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
