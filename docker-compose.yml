name: ${COMPOSE_PROJECT_NAME:-appointment-assistant}

services:
  # ==========================================
  # 1. FastAPI Backend Service
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: appointment-assistant-backend
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 4000
      PGHOST: ${PGHOST:-127.0.0.1}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-apointment_assitant}
      PGUSER: ${PGUSER:-umair}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      BACKEND_API_KEY: ${BACKEND_API_KEY:-appt_dcef54701d6e66eba727d4061616c70be6f1a8a450234f09ba585470e931c891}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      N8N_WEBHOOK_URL: ${WEBHOOK_URL:-http://127.0.0.1:5678/}
      APP_URL: ${APP_URL:-http://localhost:5173}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4000,http://127.0.0.1:4000,http://localhost:5678,http://127.0.0.1:5678}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-appointment_session}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      EMAIL_VERIFICATION_CODE_TTL_MINUTES: ${EMAIL_VERIFICATION_CODE_TTL_MINUTES:-15}
      MAIL_MODE: ${MAIL_MODE:-console}
      MAIL_FROM: ${MAIL_FROM:-Appointment Assistant <no-reply@example.com>}
      GMAIL_SENDER_EMAIL: ${GMAIL_SENDER_EMAIL:-}
      GMAIL_API_SECRET_KEY: ${GMAIL_API_SECRET_KEY:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ./backend:/app/backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:4000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ==========================================
  # 2. React / Vite Frontend Service
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: appointment-assistant-frontend
    restart: unless-stopped
    network_mode: host
    environment:
      VITE_BACKEND_URL: http://localhost:4000
      VITE_HOST: 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # ==========================================
  # 3. n8n Workflow Automation Engine
  # ==========================================
  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:latest}
    container_name: appointment-assistant-n8n
    restart: unless-stopped
    network_mode: host
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Karachi}
      TZ: ${TZ:-Asia/Karachi}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: ${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
      N8N_RUNNERS_MODE: ${N8N_RUNNERS_MODE:-internal}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      N8N_VERSION_NOTIFICATIONS_ENABLED: ${N8N_VERSION_NOTIFICATIONS_ENABLED:-true}
      N8N_TEMPLATES_ENABLED: ${N8N_TEMPLATES_ENABLED:-true}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GMAIL_SENDER_EMAIL: ${GMAIL_SENDER_EMAIL:-}
      GMAIL_API_SECRET_KEY: ${GMAIL_API_SECRET_KEY:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      DB_TYPE: sqlite
      NODE_ENV: production
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/files
      - ./credentials:/bootstrap/credentials:ro
      - ./workflow:/bootstrap/workflows:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

  # ==========================================
  # 4. Optional Isolated Container DB
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: appointment-assistant-db
    profiles:
      - container-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-apointment_assitant}
      POSTGRES_USER: ${PGUSER:-umair}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    ports:
      - "${PG_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-umair} -d ${PGDATABASE:-apointment_assitant}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:
    name: ${DB_DATA_VOLUME:-appointment-assistant_db_data}
  n8n_data:
    name: ${N8N_DATA_VOLUME:-appointment-assistant_n8n_data}
